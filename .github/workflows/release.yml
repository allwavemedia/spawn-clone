name: Build and Release SpawnClone

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

env:
  BUILD_TYPE: Release

jobs:
  build-macos:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Setup environment
      run: |
        brew install cmake
        
    - name: Configure CMake
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
        
    - name: Build SpawnClone
      run: |
        cmake --build build --config ${{env.BUILD_TYPE}}
        
    - name: Verify build artifacts
      run: |
        echo "Checking build artifacts..."
        ls -la build/SpawnClone_artefacts/
        echo "Standalone app:"
        ls -la build/SpawnClone_artefacts/Standalone/
        echo "VST3 plugin:"
        ls -la build/SpawnClone_artefacts/VST3/
        echo "AudioUnit plugin:"
        ls -la build/SpawnClone_artefacts/AU/
        
    - name: Create macOS installer
      run: |
        chmod +x scripts/build_dmg.sh
        VERSION="${{ github.event.inputs.version || '1.0.0' }}"
        ./scripts/build_dmg.sh "$VERSION"
      env:
        CODESIGN_IDENTITY: ${{ secrets.MACOS_CERTIFICATE_NAME }}
        
    - name: Upload DMG artifact
      uses: actions/upload-artifact@v4
      with:
        name: SpawnClone-macOS-DMG
        path: build/installers/macOS/*.dmg
        
    - name: Upload standalone app
      uses: actions/upload-artifact@v4
      with:
        name: SpawnClone-Standalone-macOS
        path: build/SpawnClone_artefacts/Standalone/SpawnClone.app
        
    - name: Upload plugins
      uses: actions/upload-artifact@v4
      with:
        name: SpawnClone-Plugins-macOS
        path: |
          build/SpawnClone_artefacts/VST3/
          build/SpawnClone_artefacts/AU/

  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v1.1
      
    - name: Configure CMake
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
        
    - name: Build SpawnClone
      run: |
        cmake --build build --config ${{env.BUILD_TYPE}}
        
    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SpawnClone-Windows
        path: |
          build/SpawnClone_artefacts/VST3/
          build/SpawnClone_artefacts/Standalone/

  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libasound2-dev libjack-jackd2-dev \
          ladspa-sdk libcurl4-openssl-dev libfreetype6-dev libx11-dev libxcomposite-dev \
          libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
          libwebkit2gtk-4.0-dev libglu1-mesa-dev mesa-common-dev
        
    - name: Configure CMake
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
        
    - name: Build SpawnClone
      run: |
        cmake --build build --config ${{env.BUILD_TYPE}}
        
    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SpawnClone-Linux
        path: |
          build/SpawnClone_artefacts/VST3/
          build/SpawnClone_artefacts/Standalone/

  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      
    - name: Create release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          SpawnClone-macOS-DMG/*.dmg
          SpawnClone-Standalone-macOS/**
          SpawnClone-Plugins-macOS/**
          SpawnClone-Windows/**
          SpawnClone-Linux/**
        generate_release_notes: true
        draft: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
