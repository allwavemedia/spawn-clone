sonar.projectKey=allwavemedia_spawn-clone
sonar.organization=allwavemedia

# Project metadata
sonar.projectName=SpawnClone
sonar.projectVersion=1.0.0
sonar.projectDescription=AI-Powered MIDI Pattern Generator

# Source configuration
sonar.sources=Source/
sonar.tests=Source/
sonar.test.inclusions=**/*test*.cpp,**/*Test*.cpp
sonar.test.exclusions=Source/ai/GenreSpecialist_Fixed.cpp

# C++ specific settings
sonar.cfamily.build-wrapper-output=build-wrapper-output
sonar.cfamily.cache.enabled=true
sonar.cfamily.threads=4

# Coverage settings
sonar.cfamily.gcov.reportsPath=coverage/
sonar.cfamily.llvm-cov.reportPath=coverage/coverage.txt

# Code analysis
sonar.cfamily.analysisCache.mode=server

# Exclusions
sonar.exclusions=**/build/**,**/Libs/**,**/*.pb.cc,**/*.pb.h

# Quality gate
sonar.qualitygate.wait=true

# Epic 5 Story 5.3: Enhanced code quality metrics
sonar.cfamily.deadCode.enabled=true
sonar.cfamily.security.enabled=true
sonar.cfamily.performance.enabled=true
